<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Antrean Pengisian BBM — Studi Kasus ITJ Plumpang</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230067B3%27/%3E%3Cpath d=%27M16 6l9 5v10l-9 5-9-5V11z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.2%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M7 11l9 5 9-5M16 16v10%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.2%27/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="root">
      <div id="scene" role="img" aria-label="Adegan 3D isometrik terminal pengisian: 14 filling bay, area tunggu, dua gerbang dan tangki penyimpanan. Seret untuk menggeser, seret kanan untuk memutar, gulir untuk memperbesar, klik truk atau bay untuk memilih."></div>
      <div id="labels"></div>
      <div id="tooltip" role="tooltip"><i class="tdot"></i><strong></strong><span></span></div>
      <header id="appbar"></header>
      <div id="notices"></div>
      <div id="kpis"></div>
      <div id="zoomctl"></div>
      <aside id="side"></aside>
      <section id="journey"></section>
      <section id="lists"></section>
      <div id="controls"></div>
      <footer id="footer"></footer>
      <div id="drawer" hidden><div class="drawer-head"><strong id="drawer-title"></strong><button id="drawer-close" type="button" aria-label="Tutup">✕</button></div><div id="drawer-body"></div></div>
      <nav id="drawer-tabs"></nav>
      <div id="modal" hidden></div>
      <div id="toast" hidden></div>
      <div id="loading"><i></i><span>Menyiapkan terminal…</span></div>
      <div id="error" role="alert" hidden><strong></strong><p></p><button type="button"></button></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
