<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pertamina dari ITJ Plumpang — Presentasi 3D</title>
    <meta name="description" content="Presentasi akademik business immersion ke Integrated Terminal Jakarta (Plumpang): profil Pertamina, unit bisnis, model bisnis, rantai nilai dan simulasi filling bay dalam satu dunia 3D." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230067B3%27/%3E%3Cpath d=%27M8 22l6-10 4 6 3-4 3 8z%27 fill=%27%23fff%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/presentation/style.css" />
  </head>
  <body>
    <div id="root">
      <div id="scene" role="img" aria-label="3D world of the presentation: Indonesia map, Pertamina group diorama, ITJ Plumpang terminal with moving tank trucks, and a fuel station."></div>
      <div id="vignette"></div>
      <div id="coverbg"></div>
      <div id="labels"></div>
      <section id="hero" aria-live="polite"></section>
      <div id="tooltip" role="tooltip"><i class="tdot"></i><strong></strong><span></span></div>
      <header id="topbar"></header>
      <div id="mapnav" class="card" hidden></div>
      <aside id="card" aria-live="polite"></aside>
      <div id="bottombar"></div>
      <div id="menu" hidden></div>
      <div id="help" hidden></div>
      <div id="intro" hidden></div>
      <div id="lightbox" hidden></div>
      <div id="notes" hidden></div>
      <div id="toast" hidden></div>
      <div id="loading"><i></i><span>Menyiapkan dunia 3D…</span></div>
      <div id="error" role="alert" hidden><strong></strong><p></p><button type="button"></button></div>
    </div>
    <script type="module" src="/src/presentation/main.js"></script>
  </body>
</html>
